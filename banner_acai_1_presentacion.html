<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Banner 1 - Presentacion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#999;display:flex;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif}
.banner{width:1080px;height:1920px;background:#fff;display:flex;flex-direction:column;overflow:hidden}

.topbar{background:#2a0050;padding:32px 60px;display:flex;align-items:center;justify-content:space-between}
.logo-hw{height:60px;background:#fff;border-radius:10px;padding:8px 16px}
.hw-label{text-align:right}
.hw-label p{font-size:15px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:.08em}
.hw-label span{display:block;font-size:24px;font-weight:900;color:#fff;margin-top:4px}

.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;text-align:center;background:#fff}
.logo-acai{width:380px;margin-bottom:50px}
.tag{display:inline-block;background:#ede9fe;color:#6b21a8;font-size:16px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:10px 28px;border-radius:30px;margin-bottom:36px}
.hero h1{font-size:62px;font-weight:900;color:#1a0030;line-height:1.12;margin-bottom:30px}
.hero h1 em{color:#6b21a8;font-style:normal}
.hero p{font-size:26px;color:#444;line-height:1.65;max-width:800px;margin:0 auto 50px}
.divider{display:flex;align-items:center;gap:18px;justify-content:center;margin-bottom:50px}
.divider-line{width:80px;height:3px;background:#e0e0e0;border-radius:2px}
.divider-dot{width:12px;height:12px;background:#6b21a8;border-radius:50%}

.pill-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.pill{background:#f5f5f5;border:2px solid #e0e0e0;border-radius:30px;padding:14px 28px;font-size:18px;font-weight:700;color:#333}

.footer{background:#2a0050;padding:28px 60px;text-align:center}
.footer p{font-size:16px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:.06em}
.footer span{color:#a78bfa}
</style>
